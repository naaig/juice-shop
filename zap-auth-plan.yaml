env:
  contexts:
    - name: juice-shop-auth
      urls:
        - "http://localhost:3000/"
      includePaths:
        - "http://localhost:3000.*"
      authentication:
        method: "JSON-based authentication"
        parameters:
          loginUrl: "http://localhost:3000/rest/user/login"
          loginRequestBody: '{"email":"{%username%}","password":"{%password%}"}'
          loginPageUrl: "http://localhost:3000/#/login"
          loginRequestHeader: "Content-Type: application/json"
        verification:
          method: "response"
          loggedInRegex: "authentication"
          loggedOutRegex: "Invalid email"
      users:
        - name: "admin"
          username: "zaptest@gmail.com"
          password: "Quang1998"

jobs:
  - type: "spider"
    name: "Spider as authenticated user"
    parameters:
      context: "juice-shop-auth"
      user: "admin"
      url: "http://localhost:3000/#/"
      maxDuration: 2

  - type: "activeScan"
    name: "Active Scan as authenticated user"
    parameters:
      context: "juice-shop-auth"
      user: "admin"
      policy: "Default Policy"
      maxScanDurationInMins: 10

  - type: "report"
    parameters:
      template: "traditional-html"
      reportDir: "/zap/wrk"
      reportFile: "zap-auth-report.html"
