name: "ZAP DAST Scan"

on:
  push:
    branches: [ "secops-zap" ]      
  pull_request:
    branches: [ "secops-zap" ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan local Docker instance of Juice Shop

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Start Juice Shop with Docker
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
          echo "Waiting for Juice Shop to be ready..."
          sleep 40
          docker ps
      - name: Create dummy Markdown report for ZAP action
        run: |
          echo "# ZAP Scan Report (placeholder)" > report_md.md
          echo "" >> report_md.md
          echo "This is a placeholder Markdown file so the GitHub Action does not fail." >> report_md.md
      
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:3000'
          fail_action: false
          allow_issue_writing: false
           #nếu muốn tái dùng rules sẵn có:
          rules_file_name: '.zap/rules.tsv'
          cmd_options: >
              -a -j -J report_json.json -w report.html
              -z "
              -config connection.httpHeaders.enabled=true
              -config connection.httpHeaders.numHeaders=1
              -config connection.httpHeaders.header(0).enabled=true
              -config connection.httpHeaders.header(0).name=Authorization
              -config "connection.httpHeaders.header(0).value=Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..qt17xVkgvNCybyl8UJmOID57UqYraVYzMHnbuFwbU74NaI19LAzjG163ArRWvWku0dUafB9z-_0bkqZ8se0Ov-NbtlinBq3DhxAzgBIoOB5mU94-8JFzEYUOJPHOpXLWSGL4hpVwIBfLsjwwAwqcwVXygseFyww4SY6WzxV0bBQ"
              "

      #- name: Install nuclei
      #  run: |
      #    curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest \
      #      | grep browser_download_url \
      #      | grep linux_amd64.zip \
      #      | cut -d '"' -f 4 \
      #      | wget -qi -
      #    unzip -o nuclei_*_linux_amd64.zip nuclei
      #    sudo mv nuclei /usr/local/bin/nuclei
      #    nuclei -version

      #- name: Update templates
      #  run: nuclei -ut

      #- name: Run nuclei (scan URL)
      #  env:
      #    TARGET_URL: 'http://localhost:3000'
      #  run: |
      #    nuclei -u "$TARGET_URL" \
      #      -H "Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..qt17xVkgvNCybyl8UJmOID57UqYraVYzMHnbuFwbU74NaI19LAzjG163ArRWvWku0dUafB9z-_0bkqZ8se0Ov-NbtlinBq3DhxAzgBIoOB5mU94-8JFzEYUOJPHOpXLWSGL4hpVwIBfLsjwwAwqcwVXygseFyww4SY6WzxV0bBQ" \
      #      -severity medium,high,critical \
      #      -rate-limit 10 -timeout 10 \
      #      -retries 1 \
      #      -jsonl -o nuclei.jsonl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip

      - name: Check ZAP results with rules.tsv
        run: |
          python check_zap_rules.py


      # 3. Upload report
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-full-scan-report
          path: report.html

      - name: Stop Juice Shop container
        if: always()
        run: |
          docker stop juice-shop || true
